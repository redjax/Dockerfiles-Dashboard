---
name: dockerfiles

volumes:
  metadata: {}

services:
  refreshmetadata:
    build:
      context: .
      target: refreshmetadata
    image: dockerfiles-refresh:local
    pull_policy: build
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --data-file
      - /data/dockerfiles.metadata.json
      - --interval
      - ${REFRESH_INTERVAL:-1h}
      - --log-level
      - info
    volumes:
      - metadata:/data

  dashboard:
    build:
      context: .
      target: dashboard
    image: dockerfiles-dashboard:local
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-127.0.0.1:8080}:8080"
    environment:
      DATA_FILE: /data/dockerfiles.metadata.json
      DASHBOARD_ADDR: ":8080"
    volumes:
      - metadata:/data:ro
