---
version: "3"

vars:
  OUTPUT_DIR: "dist"
  KEEPALIVE_URL: "https://dockerfiles-dashboard.onrender.com"
  KEEPALIVE_INTERVAL: "15m"
  KEEPALIVE_QUIET_HOURS: "02:00-07:00"

tasks:
  build:refreshmetadata:
    desc: "Build metadata refresher app to dist/ dir"
    aliases: [build-refreshmetadata]
    sources:
      - go.mod
      - "**/*.go"
    generates:
      - "{{.OUTPUT_DIR}}/dockerfiles-refresh"
    cmds:
      - go build -o "{{.OUTPUT_DIR}}/dockerfiles-refresh" cmd/refreshmetadata/main.go

  run:refreshmetadata:
    desc: "Run cmd/refreshmetadata/main.go. Prepend with GH_TOKEN_FILE='/path/to/gh-token' to load Github token from a file."
    aliases: [refresh-metadata]
    requires:
      vars:
        - GITHUB_TOKEN
    cmds:
      - >
        GITHUB_TOKEN="{{.GITHUB_TOKEN}}"
        go run cmd/refreshmetadata/main.go
        {{if .GH_TOKEN_FILE}}-token-file "{{.GH_TOKEN_FILE}}"{{end}}

  build:dashboard:
    desc: "Build container dashboard"
    cmds:
      - go build -o "{{.OUTPUT_DIR}}/dockerfiles-dashboard" cmd/dashboard/main.go

  run:dashboard:
    desc: "Run container dashboard"
    cmds:
      - go run cmd/dashboard/main.go

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Cross-compile both applications locally
    cmds:
      - goreleaser release --snapshot --clean

  release:build:
    desc: Produce local archives and checksums
    cmds:
      - goreleaser build --snapshot --clean

  keepalive:
    desc: Run keepalive script to keep a free-tier container running (i.e. on render.com).
    cmds:
      - >
        ./scripts/keepalive-request.sh \
          -u "{{.KEEPALIVE_URL}}" \
          --interval "{{.KEEPALIVE_INTERVAL}}" \
          --quiet-hours "{{.KEEPALIVE_QUIET_HOURS}}"
